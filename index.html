<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduVault Exam Workflow Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F0}
a{color:#1D5546}a:hover{color:#123A30}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2456A4;outline-offset:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:#56605B;font-size:13px;padding:10px 12px;border-bottom:1px solid #DADFD8;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #EBEEE9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.btn{border:1px solid #C9CFC8;background:#FFFFFF;color:#18201D;border-radius:8px;padding:0 14px;min-height:40px;font-size:14px;font-weight:500}
.btn:hover{background:#F3F4F0}
.btn-p{background:#1D5546;border-color:#1D5546;color:#FFFFFF}
.btn-p:hover{background:#174538}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:#1D5546;font-weight:600;font-size:14px;text-align:left;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.card{background:#FFFFFF;border:1px solid #DADFD8;border-radius:12px}
.sub{font-size:13px;color:#56605B}
.inp{font:inherit;font-size:14px;min-height:40px;border:1px solid #C9CFC8;border-radius:8px;padding:0 10px;background:#FFFFFF;box-sizing:border-box}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
